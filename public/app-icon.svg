<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Brand Chassis Gradient -->
    <linearGradient id="lensRingGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Primary Crisp Blade (Exact Navbar Preset) -->
    <linearGradient id="favBladeA" x1="0" y1="-17" x2="14" y2="-2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Alternate Depth Blade (Exact Navbar Preset) -->
    <linearGradient id="favBladeB" x1="0" y1="-17" x2="14" y2="-2" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Circular Camera Lens Chassis (100% Transparent outside, no squircle/square box) -->
  <circle cx="24" cy="24" r="22" fill="url(#lensRingGrad)" stroke="#312e81" stroke-width="0.8" />

  <!-- Aperture 6 Blades Assembly in Exact Logo.tsx Angles & Geometry -->
  <g transform="translate(24, 24)">
    <!-- Blade 1 (0 deg) -->
    <path
      d="M 0 -17 A 17 17 0 0 1 14.72 -8.5 L 3.5 -2 Z"
      fill="url(#favBladeA)"
      stroke="#312e81"
      stroke-width="0.8"
      stroke-linejoin="round"
    />
    <!-- Blade 2 (60 deg) -->
    <g transform="rotate(60)">
      <path
        d="M 0 -17 A 17 17 0 0 1 14.72 -8.5 L 3.5 -2 Z"
        fill="url(#favBladeB)"
        stroke="#312e81"
        stroke-width="0.8"
        stroke-linejoin="round"
      />
    </g>
    <!-- Blade 3 (120 deg) -->
    <g transform="rotate(120)">
      <path
        d="M 0 -17 A 17 17 0 0 1 14.72 -8.5 L 3.5 -2 Z"
        fill="url(#favBladeA)"
        stroke="#312e81"
        stroke-width="0.8"
        stroke-linejoin="round"
      />
    </g>
    <!-- Blade 4 (180 deg) -->
    <g transform="rotate(180)">
      <path
        d="M 0 -17 A 17 17 0 0 1 14.72 -8.5 L 3.5 -2 Z"
        fill="url(#favBladeB)"
        stroke="#312e81"
        stroke-width="0.8"
        stroke-linejoin="round"
      />
    </g>
    <!-- Blade 5 (240 deg) -->
    <g transform="rotate(240)">
      <path
        d="M 0 -17 A 17 17 0 0 1 14.72 -8.5 L 3.5 -2 Z"
        fill="url(#favBladeA)"
        stroke="#312e81"
        stroke-width="0.8"
        stroke-linejoin="round"
      />
    </g>
    <!-- Blade 6 (300 deg) -->
    <g transform="rotate(300)">
      <path
        d="M 0 -17 A 17 17 0 0 1 14.72 -8.5 L 3.5 -2 Z"
        fill="url(#favBladeB)"
        stroke="#312e81"
        stroke-width="0.8"
        stroke-linejoin="round"
      />
    </g>

    <!-- Center Focal Opening & Crisp White Dot -->
    <circle cx="0" cy="0" r="4.2" fill="#1e1b4b" />
    <circle cx="0" cy="0" r="2.2" fill="#ffffff" />
  </g>
</svg>
